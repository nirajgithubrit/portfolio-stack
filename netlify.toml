[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = "dist/web/browser"

# SPA fallback for Angular routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy (update hostname after backend deployment)
[[redirects]]
  from = "/api/*"
  to = "https://your-render-service.onrender.com/api/:splat"
  status = 200
  force = true
