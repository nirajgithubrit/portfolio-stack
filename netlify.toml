[build]
  base = "apps/web"
  command = "npm ci && npm run build"
  publish = "dist/web/browser"

# API proxy – must come first so /api does not hit SPA fallback
[[redirects]]
  from = "/api/*"
  to = "https://portfolio-stack-pkld.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for Angular routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
