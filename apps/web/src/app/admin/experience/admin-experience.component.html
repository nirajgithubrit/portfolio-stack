<div>
  <h1 class="text-2xl font-bold text-white">Experience</h1>
  @if (error(); as err) {
    <p class="mt-2 text-sm text-rose-300">{{ err }}</p>
  }
  <div class="mt-6 space-y-3">
    @for (x of items(); track trackById($index, x)) {
      <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl border border-white/10 bg-white/5 p-4">
        <div>
          <p class="font-semibold text-white">{{ x.title }} · {{ x.company }}</p>
          <p class="text-xs text-slate-500">{{ x.startDate | slice: 0:10 }} — {{ x.endDate ? (x.endDate | slice: 0:10) : 'Present' }}</p>
        </div>
        <div class="space-x-2">
          <button type="button" class="text-cyan-300 hover:underline" (click)="startEdit(x)">Edit</button>
          <button type="button" class="text-rose-300 hover:underline" (click)="deleteExp(x._id)">Delete</button>
        </div>
      </div>
    }
  </div>

  <h2 class="mt-10 text-lg font-semibold text-white">Add experience</h2>
  <form [formGroup]="form" (ngSubmit)="create()" class="mt-4 grid gap-3 sm:grid-cols-2">
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="company" placeholder="Company" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="title" placeholder="Title" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="location" placeholder="Location" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="date" formControlName="startDate" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="date" formControlName="endDate" />
    <textarea class="sm:col-span-2 min-h-[80px] rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="description"></textarea>
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="number" formControlName="order" />
    <button type="submit" class="sm:col-span-2 rounded-xl bg-gradient-to-r from-cyan-500 to-violet-500 py-2 text-sm font-semibold text-night-950" [disabled]="busy()">Create</button>
  </form>
</div>

@if (editing(); as e) {
  <div class="fixed inset-0 z-[120] flex items-center justify-center bg-black/70 p-4" (click)="closeEdit()">
    <div class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl border border-white/10 bg-night-900 p-6" (click)="$event.stopPropagation()">
      <h3 class="font-bold text-white">Edit experience</h3>
      <div class="mt-4 grid gap-3">
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.company" (input)="patch('company', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.title" (input)="patch('title', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.location" (input)="patch('location', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="date" [value]="toInputDate(e.startDate)" (input)="patch('startDate', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="date" [value]="toInputDate(e.endDate)" (input)="patch('endDate', $any($event.target).value || null)" />
        <textarea class="min-h-[100px] rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.description" (input)="patch('description', $any($event.target).value)"></textarea>
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="number" [value]="e.order" (input)="patch('order', +$any($event.target).value)" />
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="rounded-lg border border-white/10 px-4 py-2 text-sm" (click)="closeEdit()">Cancel</button>
        <button type="button" class="rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-night-950" (click)="saveEdit()">Save</button>
      </div>
    </div>
  </div>
}
