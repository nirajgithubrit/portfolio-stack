<div>
  <h1 class="text-2xl font-bold text-white">Contact messages</h1>
  @if (error(); as err) {
    <p class="mt-2 text-sm text-rose-300">{{ err }}</p>
  }
  <div class="mt-6 space-y-3">
    @for (m of items(); track trackById($index, m)) {
      <article class="rounded-xl border border-white/10 bg-white/5 p-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <p class="font-semibold text-white">{{ m.name }} · {{ m.email }}</p>
          <span class="text-xs text-slate-500">{{ m.createdAt | date: 'medium' }}</span>
        </div>
        <p class="mt-2 text-sm text-cyan-100/90">{{ m.subject }}</p>
        <p class="mt-2 text-sm text-slate-300">{{ m.message }}</p>
        @if (m.read) {
          <p class="mt-2 text-xs text-emerald-400/90">Read</p>
        }
      </article>
    }
  </div>
</div>
