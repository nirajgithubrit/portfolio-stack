<div>
  <h1 class="text-2xl font-bold text-white">Projects</h1>
  @if (error(); as err) {
    <p class="mt-2 text-sm text-rose-300">{{ err }}</p>
  }

  <div class="mt-8 overflow-x-auto rounded-xl border border-white/10">
    <table class="min-w-full text-left text-sm">
      <thead class="border-b border-white/10 bg-white/5 text-slate-400">
        <tr>
          <th class="px-3 py-2">Title</th>
          <th class="px-3 py-2">Slug</th>
          <th class="px-3 py-2">Status</th>
          <th class="px-3 py-2">Role</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody>
        @for (p of items(); track trackById($index, p)) {
          <tr class="border-b border-white/5 hover:bg-white/5">
            <td class="px-3 py-2 text-white">{{ p.title }}</td>
            <td class="px-3 py-2 text-slate-400">{{ p.slug }}</td>
            <td class="px-3 py-2 text-slate-300">{{ p.status }}</td>
            <td class="px-3 py-2 text-slate-300">{{ p.role }}</td>
            <td class="space-x-2 px-3 py-2 text-right">
              <button type="button" class="text-cyan-300 hover:underline" (click)="startEdit(p)">Edit</button>
              <button type="button" class="text-rose-300 hover:underline" (click)="deleteProject(p._id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <h2 class="mt-10 text-lg font-semibold text-white">Add project</h2>
  <form [formGroup]="form" (ngSubmit)="create()" class="mt-4 grid gap-3 sm:grid-cols-2">
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="title" placeholder="Title" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="slug" placeholder="slug-url" />
    <input class="sm:col-span-2 rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="summary" placeholder="Summary" />
    <textarea
      class="sm:col-span-2 min-h-[88px] rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm"
      formControlName="description"
      placeholder="Description"
    ></textarea>
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="imageUrl" placeholder="Image URL" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="githubUrl" placeholder="GitHub URL" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="liveUrl" placeholder="Live URL" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="techStack" placeholder="Tech (comma separated)" />
    <select class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="status">
      <option value="completed">Completed</option>
      <option value="live">Live</option>
    </select>
    <select class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="role">
      <option value="frontend">Frontend</option>
      <option value="fullstack">Full Stack</option>
    </select>
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="duration" placeholder="Duration (e.g. Jan 2024 - Mar 2025)" />
    <label class="flex items-center gap-2 text-sm text-slate-300">
      <input type="checkbox" formControlName="featured" />
      Featured
    </label>
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="number" formControlName="order" placeholder="Order" />
    <button
      type="submit"
      class="sm:col-span-2 rounded-xl bg-gradient-to-r from-cyan-500 to-violet-500 py-2 text-sm font-semibold text-night-950 disabled:opacity-50"
      [disabled]="busy()"
    >
      Create
    </button>
  </form>
</div>

@if (editing(); as e) {
  <div class="fixed inset-0 z-[120] flex items-center justify-center bg-black/70 p-4 backdrop-blur-sm" (click)="closeEdit()">
    <div
      class="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-2xl border border-white/10 bg-night-900 p-6"
      (click)="$event.stopPropagation()"
    >
      <h3 class="text-lg font-bold text-white">Edit project</h3>
      <div class="mt-4 grid gap-3">
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.title" placeholder="Project title" (input)="patchEdit('title', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.slug" placeholder="project-slug" (input)="patchEdit('slug', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.summary" placeholder="1-2 line short summary" (input)="patchEdit('summary', $any($event.target).value)" />
        <textarea class="min-h-[100px] rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.description" placeholder="Detailed project description..." (input)="patchEdit('description', $any($event.target).value)"></textarea>
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.imageUrl" placeholder="https://..." (input)="patchEdit('imageUrl', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.githubUrl" placeholder="https://github.com/username/repo" (input)="patchEdit('githubUrl', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.liveUrl" placeholder="https://your-live-site.com" (input)="patchEdit('liveUrl', $any($event.target).value)" />
        <input
          class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm"
          [value]="techStackString()"
          placeholder="Angular, TypeScript, RxJS"
          (input)="setTechStackFromInput($any($event.target).value)"
        />
        <select class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.status" (change)="patchEdit('status', $any($event.target).value)">
          <option value="completed">Completed</option>
          <option value="live">Live</option>
        </select>
        <select class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.role" (change)="patchEdit('role', $any($event.target).value)">
          <option value="frontend">Frontend</option>
          <option value="fullstack">Full Stack</option>
        </select>
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.duration" placeholder="Jan 2024 - Mar 2025" (input)="patchEdit('duration', $any($event.target).value)" />
        <label class="flex items-center gap-2 text-sm text-slate-300">
          <input type="checkbox" [checked]="e.featured" (change)="patchEdit('featured', $any($event.target).checked)" />
          Featured
        </label>
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="number" [value]="e.order" (input)="patchEdit('order', +$any($event.target).value)" />
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="rounded-lg border border-white/10 px-4 py-2 text-sm" (click)="closeEdit()">Cancel</button>
        <button type="button" class="rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-night-950" (click)="saveEdit()" [disabled]="busy()">Save</button>
      </div>
    </div>
  </div>
}
