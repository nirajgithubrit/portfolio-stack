<div>
  <h1 class="text-2xl font-bold text-white">Skills</h1>
  @if (error(); as err) {
    <p class="mt-2 text-sm text-rose-300">{{ err }}</p>
  }
  <div class="mt-6 overflow-x-auto rounded-xl border border-white/10">
    <table class="min-w-full text-left text-sm">
      <thead class="border-b border-white/10 bg-white/5 text-slate-400">
        <tr>
          <th class="px-3 py-2">Name</th>
          <th class="px-3 py-2">Category</th>
          <th class="px-3 py-2">%</th>
          <th class="px-3 py-2"></th>
        </tr>
      </thead>
      <tbody>
        @for (s of items(); track trackById($index, s)) {
          <tr class="border-b border-white/5 hover:bg-white/5">
            <td class="px-3 py-2 text-white">{{ s.name }}</td>
            <td class="px-3 py-2 text-slate-400">{{ s.category }}</td>
            <td class="px-3 py-2">{{ s.proficiency }}</td>
            <td class="space-x-2 px-3 py-2 text-right">
              <button type="button" class="text-cyan-300 hover:underline" (click)="startEdit(s)">Edit</button>
              <button type="button" class="text-rose-300 hover:underline" (click)="deleteSkill(s._id)">Delete</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <h2 class="mt-10 text-lg font-semibold text-white">Add skill</h2>
  <form [formGroup]="form" (ngSubmit)="create()" class="mt-4 grid gap-3 sm:grid-cols-2">
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="name" placeholder="Name" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" formControlName="category" placeholder="Category" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="number" formControlName="proficiency" />
    <input class="rounded-lg border border-white/10 bg-night-900 px-3 py-2 text-sm" type="number" formControlName="order" />
    <button type="submit" class="sm:col-span-2 rounded-xl bg-gradient-to-r from-cyan-500 to-violet-500 py-2 text-sm font-semibold text-night-950" [disabled]="busy()">Create</button>
  </form>
</div>

@if (editing(); as e) {
  <div class="fixed inset-0 z-[120] flex items-center justify-center bg-black/70 p-4" (click)="closeEdit()">
    <div class="w-full max-w-md rounded-2xl border border-white/10 bg-night-900 p-6" (click)="$event.stopPropagation()">
      <h3 class="font-bold text-white">Edit skill</h3>
      <div class="mt-4 grid gap-3">
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.name" (input)="patch('name', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" [value]="e.category" (input)="patch('category', $any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="number" [value]="e.proficiency" (input)="patch('proficiency', +$any($event.target).value)" />
        <input class="rounded-lg border border-white/10 bg-night-950 px-3 py-2 text-sm" type="number" [value]="e.order" (input)="patch('order', +$any($event.target).value)" />
      </div>
      <div class="mt-6 flex justify-end gap-2">
        <button type="button" class="rounded-lg border border-white/10 px-4 py-2 text-sm" (click)="closeEdit()">Cancel</button>
        <button type="button" class="rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-night-950" (click)="saveEdit()">Save</button>
      </div>
    </div>
  </div>
}
